services:
  niks3:
    image: ghcr.io/mic92/niks3:v1.19.0@sha256:732f9006ee9fb9a68fbffc9570e0d4b9766e451ff25451d7ff7ce465b95ef320
    container_name: niks3
    restart: unless-stopped
    environment:
      # NIKS3_DB unset: pgx reads libpq PG* vars
      PGHOST: niks3-db
      PGUSER: niks3
      PGPASSWORD: ${NIKS3_POSTGRES_PASSWORD}
      PGDATABASE: niks3
      PGSSLMODE: disable
      # S3 via the internal garage container; presigned upload URLs use the public route
      NIKS3_S3_ENDPOINT: garage:33900
      NIKS3_S3_USE_SSL: "false"
      NIKS3_S3_BUCKET_LOOKUP: path
      NIKS3_S3_REGION: ${NIKS3_S3_REGION}
      NIKS3_S3_PUBLIC_URL: https://garage.${DOMAIN_CC}
      NIKS3_S3_BUCKET: nix-niks3
      NIKS3_S3_ACCESS_KEY: ${NIKS3_S3_ACCESS_KEY}
      NIKS3_S3_SECRET_KEY: ${NIKS3_S3_SECRET_KEY}
      NIKS3_API_TOKEN: ${NIKS3_API_TOKEN}
      NIKS3_SIGN_KEY_PATHS: /secrets/signing-key
      # bucket stays private; nix clients substitute from niks3 itself
      NIKS3_ENABLE_READ_PROXY: "true"
      NIKS3_CACHE_URL: https://niks3.${DOMAIN_CC}
      # Any provider granting `read` gates the read proxy; hosts read with the
      # static API token via netrc (Basic auth password)
      NIKS3_OIDC_CONFIG: /etc/niks3/oidc.json
    secrets:
      - source: niks3_signing_key
        target: /secrets/signing-key
    configs:
      - source: niks3_oidc
        target: /etc/niks3/oidc.json
    depends_on:
      niks3-db:
        condition: service_healthy
    networks:
      - default
      - traefik_external_public_web
    labels:
      traefik.enable: true
      traefik.public: true
      traefik.http.routers.niks3.rule: Host(`niks3.${DOMAIN_CC}`)
      traefik.http.services.niks3.loadbalancer.server.port: 5751
      traefik.http.routers.niks3.service: niks3
      traefik.docker.network: traefik_external_public_web
      traefik.http.routers.niks3.entrypoints: https
      # labelgate
      labelgate.dns.niks3.hostname: niks3.${DOMAIN_CC}
      labelgate.dns.niks3.credential: public
      labelgate.dns.niks3.proxied: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5751/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  niks3-db:
    image: postgres:16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
    container_name: niks3-db
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_USER: niks3
      POSTGRES_PASSWORD: ${NIKS3_POSTGRES_PASSWORD}
      POSTGRES_DB: niks3
    volumes:
      - ${DOCKER_DATA}/niks3/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niks3 -d niks3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  # one-line `nix key generate-secret` output, injected from sops env
  niks3_signing_key:
    environment: NIKS3_SIGNING_KEY

configs:
  # pocket-id users in group niks3-readers may get read-only tokens.
  # jwks_url skips discovery so niks3 starts even when pocket-id is down.
  niks3_oidc:
    content: |
      {
        "providers": {
          "pocket-id": {
            "issuer": "https://${DOMAIN_POCKETID}",
            "jwks_url": "https://${DOMAIN_POCKETID}/.well-known/jwks.json",
            "audience": "https://niks3.${DOMAIN_CC}",
            "bound_claims": { "groups": ["niks3-readers"] },
            "scopes": ["read"]
          }
        }
      }

networks:
  default:
  traefik_external_public_web:
    external: true
