services:
  traefik:
    image: "traefik:v3.7.16@sha256:6d3e069ee484ab1da5adfdda555a75eb9b1545ef09096a0cc7c3043101986a20"
    restart: unless-stopped
    container_name: traefik-external
    networks:
      public_web:
      traefik_ex_admin:
      crowdsec_net:
        ipv4_address: 10.97.100.99
    depends_on:
      socket-proxy:
        condition: service_healthy
        restart: true
      traefik-external-redis:
        condition: service_healthy
    # command: 
    #   - "--api.insecure=true"
    #   - "--providers.docker"
    #   - "--ping=true"
    #   - "--ping.entrypoint=traefik"
    env_file: ./.env
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      #- "0.0.0.0:80:80"
      #- "[::]:80:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
      - "${IP_ANNULATUS}:31080:8080"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - $DOCKER_DATA/traefik_external/traefik/letsencrypt:/letsencrypt
      - $DOCKER_DATA/traefik_external/traefik/certificates:/certificates
      - $DOCKER_DATA/traefik_external/traefik/log:/var/log/traefik:rw
      - $DOCKER_DATA/traefik_external/traefik/static_config:/etc/traefik:rw
      - $DOCKER_DATA/traefik_external/traefik/dynamic_config:/config/dynamic:rw
      - $DOCKER_DATA/traefik_external/traefik/ban.html:/config/ban.html:ro
      #- "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      kop.poecilia.traefik.enable: true
      kop.poecilia.traefik.http.routers.traefik-dashboard-external.rule: Host(`traefik-public.${DOMAIN_INT}`)
      kop.poecilia.traefik.http.routers.traefik-dashboard-external.entrypoints: websecure
      kop.poecilia.traefik.http.services.traefik-dashboard-external.loadbalancer.server.port: 31080
      kop.poecilia.traefik.http.routers.traefik-dashboard-external.service: traefik-dashboard-external
      kop.namespace: poecilia
      #homepage settings
      homepage.group: Monitoring
      homepage.name: Traefik (Public)
      homepage.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/traefik.png
      homepage.href: "https://traefik-public.${DOMAIN_INT}"
      homepage.widget.type: traefik
      homepage.widget.url: https://traefik-public.${DOMAIN_INT}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  crowdsec:
    image: "crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a"
    container_name: crowdsec
    networks:
      - crowdsec_net
    environment:
      COLLECTIONS: >-
        crowdsecurity/linux
        crowdsecurity/traefik
        crowdsecurity/whitelist-good-actors
        crowdsecurity/appsec-crs
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
        crowdsecurity/http-cve
        crowdsecurity/appsec-bot-challenge
      SCENARIOS: >-
        crowdsecurity/http-crawl-non_statics
        crowdsecurity/http-dos-random-uri
      PARSERS: >-
        crowdsecurity/geoip-enrich
      CUSTOM_HOSTNAME: crowdsec
      GID: ${GID_NIXOS_RL}
      LEVEL_INFO: "true"
      TZ: ${LOCAL_TZ}
    ports:
      - "4242:4242/tcp"
      - "6060:6060/tcp"
      - "48387:8080/tcp"
    restart: "always"
    volumes:
      - $DOCKER_DATA/crowdsec/config:/etc/crowdsec
      - $DOCKER_DATA/crowdsec/data:/var/lib/crowdsec/data
      - $DOCKER_DATA/crowdsec/logs:/var/log/crowdsec

  logrotate:
    image: vegardit/traefik-logrotate:latest@sha256:410006e29707d6a06e1c18341f0ef1c270dfc5f9b1993158aff014ede434039e
    container_name: traefik-logrotate
    network_mode: none
    restart: unless-stopped
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw # required to send USR1 signal to Traefik after log rotation
      - $DOCKER_DATA/traefik_external/traefik/log:/var/log/traefik:rw # folder containing access.log file
    environment:
      TZ: "${LOCAL_TZ}"
      # all environment variables are optional and show the default values:
      LOGROTATE_LOGS: "/var/log/traefik/*.log" # log files to rotate, directory must match volume mount
      LOGROTATE_TRIGGER_INTERVAL: weekly # rotate daily, must be one of: daily, weekly, monthly, yearly
      LOGROTATE_TRIGGER_SIZE: 200M # rotate if log file size reaches 50MB
      LOGROTATE_MAX_BACKUPS: 14 # keep 14 backup copies per rotated log file
      LOGROTATE_START_INDEX: 1 # first rotated file is called access.1.log
      #LOGROTATE_FILE_MODE: 0644 # file mode of the rotated file
      #LOGROTATE_FILE_USER: root # owning user of the rotated file
      LOGROTATE_USE_DATEEXT: "true"
      LOGROTATE_DATEFORMAT: "-%Y%m%d-%H"
      #LOGROTATE_FILE_GROUP: root # owning group of the rotated file
      CRON_SCHEDULE: "* * * * *"
      CRON_LOG_LEVEL: 8 # see https://unix.stackexchange.com/a/414010/378036
      TRAEFIK_CONTAINER_ID_COMMAND: "true"
      # command to determine the id of the container running Traefik:
      #TRAEFIK_CONTAINER_ID_COMMAND: docker ps --no-trunc --quiet --filter label=org.opencontainers.image.title=Traefik
    configs:
      - source: logrotate_template
        target: /opt/logrotate.conf.template
        mode: 0444

  traefik-access-logs:
    image: alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    container_name: traefik-external-access-logs
    volumes:
      - $DOCKER_DATA/traefik_external/traefik/log:/var/log:ro
    command: >
      sh -c "tail -F /var/log/access.log"
    network_mode: none
    restart: unless-stopped

  traefik-external-redis:
    restart: always
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: traefik-external-redis
    # ports:
    #   - "6379:6379"
    networks:
      - traefik_ex_admin
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - $DOCKER_DATA/traefik_external/redis:/data

  cloudflare_tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    command: tunnel run --token ${TRAEFIK_EX_CFTUNNEL_PUBLIC_TOKEN}
    #command: tunnel run --token ${TRAEFIK_EX_CFTUNNEL_PUBLIC_TOKEN} --protocol http2
    #command: tunnel run
    environment:
        #TUNNEL_METRICS: 0.0.0.0:20241
        TUNNEL_EDGE_IP_VERSION: auto
    networks:
      public_web:
        priority: 100
      lan_v6:
        priority: 50

  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    container_name: traefik-ext-socket-proxy
    restart: unless-stopped
    user: "65534:131"        # DOCKER_GID = `stat -c %g /var/run/docker.sock`
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64M
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=traefik,crowdsec,10.1.10.0/24' 
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|version|info|containers/.*|events.*)'
      - '-allowhealthcheck'
      - '-watchdoginterval=300'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - crowdsec_net
      # - kop_net
      # - traefik_ex_admin
    ports:
      - "0.0.0.0:2375:2375"
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3



networks:
  traefik_ex_admin:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.0.0/24
  public_web:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/16
  # traefik_external_crowdsec_net:
  #   external: true
  crowdsec_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.100.0/24
  lan_v6:
    driver: macvlan
    enable_ipv6: true
    enable_ipv4: false
    driver_opts:
      parent: enp1s0
    ipam:
      config:
        - subnet: ${LOCAL_V6_SVC}::/64
          gateway: ${LOCAL_V6_SVC}::1
          ip_range: ${LOCAL_V6_SVC}::7a4f:c2d8:0/120
  kop_net:

configs:
  logrotate_template:
    content: |
      $${LOGROTATE_LOGS} {
        copytruncate
        $${LOGROTATE_TRIGGER_INTERVAL}
        maxsize $${LOGROTATE_TRIGGER_SIZE}
        rotate $${LOGROTATE_MAX_BACKUPS}
        $${LOGROTATE_NAMING_CONFIG}

        missingok
        notifempty

        compress
        delaycompress

        su root root
      }