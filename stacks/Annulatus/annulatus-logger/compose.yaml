
services:
  victorialogs:
    container_name: victorialogs
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    restart: unless-stopped
    networks:
      - annulatus-logger-net
    ports:
      - ${IP_ANNULATUS}:39428:9428
    volumes:
      - ${DOCKER_DATA}/annulatus-logger/victorialogs:/vlogs
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=720d
      - -retention.maxDiskSpaceUsageBytes=50GiB

  geoipupdate:
    container_name: geoipupdate
    image: maxmindinc/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    restart: unless-stopped
    networks:
      - annulatus-logger-net
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City GeoLite2-ASN
      GEOIPUPDATE_FREQUENCY: 72
    volumes:
      - ${DOCKER_DATA}/annulatus-logger/geoip:/usr/share/GeoIP

  vector:
    container_name: vector
    image: timberio/vector:0.60.0-alpine@sha256:1c6a6c4c5c9de08df357fa8adbe72e5a7abcea458b0bd82de0b14ac9b79d5b31
    restart: unless-stopped
    networks:
      - annulatus-logger-net
    depends_on:
      - victorialogs
    volumes:
      - ${DOCKER_DATA}/traefik_external/traefik/log:/var/log/traefik:ro
      - ${DOCKER_DATA}/annulatus-logger/geoip:/geoip:ro
      - ${DOCKER_DATA}/annulatus-logger/vector:/var/lib/vector
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml

configs:
  vector_config:
    content: |
      data_dir: /var/lib/vector
      enrichment_tables:
        geoip_city:
          type: geoip
          path: /geoip/GeoLite2-City.mmdb
        geoip_asn:
          type: mmdb
          path: /geoip/GeoLite2-ASN.mmdb
      sources:
        traefik:
          type: file
          include:
            - /var/log/traefik/access.log
          read_from: beginning
      transforms:
        enrich:
          type: remap
          inputs: [traefik]
          drop_on_abort: true
          source: |
            . = parse_json!(string!(.message))
            .app = "traefik"
            .hostname = "annulatus"
            ip = to_string(.ClientHost) ?? ""
            city, err = get_enrichment_table_record("geoip_city", {"ip": ip})
            if err == null {
              .geo_country = city.country_code
              .geo_city = city.city_name
            }
            asn, err = get_enrichment_table_record("geoip_asn", {"ip": ip})
            if err == null {
              .geo_asn = asn.autonomous_system_number
              .geo_as_org = asn.autonomous_system_organization
            }
      sinks:
        vlogs:
          type: http
          inputs: [enrich]
          uri: http://victorialogs:9428/insert/jsonline?_stream_fields=app,hostname&_msg_field=RequestPath&_time_field=StartUTC
          encoding:
            codec: json
          framing:
            method: newline_delimited
          compression: gzip
          healthcheck:
            enabled: false
          buffer:
            type: disk
            max_size: 1073741824
            when_full: block

networks:
  annulatus-logger-net:
    name: annulatus-logger-net
