    image: xhongc/music_tag_web:2.8.2@sha256:4682a379f3b420afcbe0439ae2a78b2641748a96df60b9cfbec9600c804885fe
    container_name: music-tag-web
    ports:
      - "38239:8002"
    volumes:
      - $PATH_MEDIACENTRE:/app/media:rw
      - $DOCKER_DATA/music-tag/config:/app/data
