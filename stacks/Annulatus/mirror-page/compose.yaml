services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: mirror-page-caddy
    restart: unless-stopped
    ports:
      - "35881:80"
    volumes:
      # Mount mirrors directory (read-only)
      - ${PATH_CP}/Mirrors/mirrors-data:/data/mirrors:ro
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    networks:
      - mirror-network
      - traefik_external_public_web
    labels:
      traefik.enable: true
      traefik.public: true
      traefik.docker.network: traefik_external_public_web
      #-----
      traefik.http.routers.mirrors-page.rule: Host(`${DOMAIN_MIRRORS}`)
      traefik.http.routers.mirrors-page.entrypoints: cf
      traefik.http.services.mirrors-page.loadbalancer.server.port: 80
      traefik.http.routers.mirrors-page.service: mirrors-page
      # --- labelgate --- #
      labelgate.tunnel.mirrors-page.hostname: ${DOMAIN_MIRRORS}
      labelgate.tunnel.mirrors-page.service: http://traefik:808
      #-----
      traefik.http.routers.mirrors-page-local.rule: Host(`mirrors.${DOMAIN_INT}`)
      traefik.http.routers.mirrors-page-local.entrypoints: https
      traefik.http.routers.mirrors-page-local.service: mirrors-page


networks:
  mirror-network:
    driver: bridge
  traefik_external_public_web:
    external: true

configs:
  caddy_config:
    content: |
      # :80 {
      #     # Handle Next.js routes
      #     @nextjs {
      #         path /api/* /_next/* /favicon.svg /robots.txt /
      #     }
      #     reverse_proxy @nextjs nextjs:3000

      #     # Everything else serves static mirror files
      #     root * /data/mirrors
      #     file_server browse {
      #         hide .git
      #     }
      # }
      :80 {
          handle /_next/* {
              root * /data/mirrors/index
              file_server
          }
          handle /favicon.svg {
              root * /data/mirrors/index
              file_server
          }
          # Serve the index page
          handle / {
              root * /data/mirrors/index
              try_files /index.html
              file_server
          }
          # Serve the index page for explicit index.html request
          handle /index.html {
              root * /data/mirrors/index
              file_server
          }
          # Everything else serves static mirror files
          root * /data/mirrors
          file_server browse {
              hide .git
          }
      }