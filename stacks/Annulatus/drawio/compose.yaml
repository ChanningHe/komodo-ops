version: '3.5'
services:
  drawio:
    image: jgraph/drawio:32.6.10@sha256:7d856f20877dc4119cbb497377208768392031fbbafe91507df8146f7e669646
    container_name: drawio
    restart: unless-stopped
    ports:
      - 36711:8080
      #- 8443:8443
    #environment:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://domain:8080 || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 10s