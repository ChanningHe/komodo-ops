services:
  rdma-exporter:
    container_name: rdma-exporter
    network_mode: host
    restart: unless-stopped
    read_only: true
    volumes:
      - /sys/class/infiniband:/sys/class/infiniband:ro
    environment:
      - RDMA_EXPORTER_LOG_LEVEL=info
    image: ghcr.io/yuuki/rdma_exporter:0.7.5@sha256:ec89daa942f927626d5b2a4e1db113a1bb9159e2fa8a02a0c699d13ac52fd524
networks: {}
