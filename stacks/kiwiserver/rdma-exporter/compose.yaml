services:
  rdma-exporter:
    container_name: rdma-exporter
    network_mode: host
    restart: unless-stopped
    read_only: true
    volumes:
      - /sys/class/infiniband:/sys/class/infiniband:ro
    environment:
      - RDMA_EXPORTER_LOG_LEVEL=info
    image: ghcr.io/yuuki/rdma_exporter:0.7.4@sha256:4188db1707c2e4d9ff079de4a2d03905e57153d9dc56eca7b7dc446e4f91222d
networks: {}
