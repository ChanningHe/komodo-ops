services:
  rdma-exporter:
    container_name: rdma-exporter
    network_mode: host
    restart: unless-stopped
    read_only: true
    volumes:
      - /sys/class/infiniband:/sys/class/infiniband:ro
    environment:
      - RDMA_EXPORTER_LOG_LEVEL=info
    image: ghcr.io/yuuki/rdma_exporter:0.7.3@sha256:74c980bc345f828ef3c985f7d6124adc5cc146d22c1558b02d8de4880cf04678
networks: {}
