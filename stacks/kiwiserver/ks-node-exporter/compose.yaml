services:
  node-exporter:
    container_name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    network_mode: host
    pid: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --web.listen-address=:29100
      # defaults + TrueNAS apps internals (docker overlay/volumes under /mnt/.ix-apps)
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+|mnt/\.ix-apps/.+)($|/)

  smartctl-exporter:
    container_name: smartctl-exporter
    image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    restart: unless-stopped
    # raw SMART/NVMe ioctls on host block devices need root + privileged (per upstream README)
    privileged: true
    user: root
    ports:
      - 29633:9633
    command:
      # skip disks in standby so polling never spins them up (upstream default, pinned explicitly)
      - --smartctl.powermode-check=standby
      - --smartctl.interval=60s

networks: {}
