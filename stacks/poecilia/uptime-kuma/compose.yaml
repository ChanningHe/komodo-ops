services:
  uptime-kuma:
    restart: always
    ports:
      - 43701:3001
    volumes:
      - $DOCKER_DATA/uptime-kuma/data:/app/data
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2.5.3@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
    networks:
      - traefik-poecilia_local_web
    labels:
      traefik.enable: true
      traefik.http.routers.uptime.rule: Host(`uptime.${DOMAIN_INT}`)|| Host(`uptime`)
      traefik.http.services.uptime.loadbalancer.server.port: 3001
      traefik.docker.network: traefik-poecilia_local_web
networks:
  traefik-poecilia_local_web:
    external: true
