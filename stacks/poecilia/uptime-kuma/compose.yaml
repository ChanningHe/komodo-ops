services:
  uptime-kuma:
    restart: always
    ports:
      - 43701:3001
    volumes:
      - $DOCKER_DATA/uptime-kuma/data:/app/data
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    networks:
      - traefik-poecilia_local_web
    labels:
      traefik.enable: true
      traefik.http.routers.uptime.rule: Host(`uptime.${DOMAIN_INT}`)|| Host(`uptime`)
      traefik.http.services.uptime.loadbalancer.server.port: 3001
      traefik.docker.network: traefik-poecilia_local_web
networks:
  traefik-poecilia_local_web:
    external: true
