services:
  apc-snmp-exporter:
    container_name: apc-snmp-exporter
    image: quay.io/prometheus/snmp-exporter:v0.31.0@sha256:e5f1aba929145cea2a3bad89c29959efaec0dc26fb87e3761414616a1a392c1c
    restart: unless-stopped
    #read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-poecilia_local_web
    command:
      # upstream default config, ships the `apcups` module (PowerNet-MIB)
      - --config.file=/etc/snmp_exporter/snmp.yml
      # extra auth block merged on top; community comes from compose interpolation
      - --config.file=/etc/snmp_exporter/auth.yml
    configs:
      - source: apc_auth
        target: /etc/snmp_exporter/auth.yml

configs:
  apc_auth:
    content: |
      auths:
        apc_v1:
          community: ${APC_SNMP_COMMUNITY:-public}
          version: 1

networks:
  traefik-poecilia_local_web:
    external: true
