services:
  magpie:
    image: ghcr.io/yetone/magpie:0.1.4098@sha256:f6c358e003aa8945ec575f545f047ee80c172896d0fc35ab92922637e0539376
    restart: unless-stopped
    ports:
      - "33430:33430"
    environment:
      MAGPIE_ADDR: 0.0.0.0:33425
      MAGPIE_PUBLIC_URL: https://magpie.${DOMAIN_INT}
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY}
    volumes:
      - ${DOCKER_DATA}/magpie/config:/config
    command: [web, --addr, 0.0.0.0:33430, --no-open]
    networks:
      - traefik-poecilia_local_web
    labels:
      traefik.enable: true
      traefik.http.routers.magpie.rule: Host(`magpie.${DOMAIN_INT}`)
      traefik.http.services.magpie.loadbalancer.server.port: 33425
      traefik.docker.network: traefik-poecilia_local_web
networks:
  traefik-poecilia_local_web:
    external: true
