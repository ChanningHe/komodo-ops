services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      # - PUID=${PM_RT_UID}
      # - PGID=${PM_RT_GID}
    volumes:
      - $DOCKER_DATA/homepage/config:/app/config
      - $DOCKER_DATA/homepage/icons:/app/public/icons
      - $DOCKER_DATA/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 53300:3000
    restart: unless-stopped
    # labels:
    #   - diun.enable=true
    network_mode: bridge
