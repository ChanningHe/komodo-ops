services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      # - PUID=${PM_RT_UID}
      # - PGID=${PM_RT_GID}
    volumes:
      - $DOCKER_DATA/homepage/config:/app/config
      - $DOCKER_DATA/homepage/icons:/app/public/icons
      - $DOCKER_DATA/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 53300:3000
    restart: unless-stopped
    # labels:
    #   - diun.enable=true
    network_mode: bridge
